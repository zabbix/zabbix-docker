server {
    listen 8080;
    include /etc/nginx/includes/listen-ipv6.conf;

    include /etc/nginx/includes/real-ip.conf;
    include /etc/nginx/includes/server-common.conf;
}

server {
    listen 8081;
    include /etc/nginx/includes/listen-ipv6-health.conf;

    set $webroot '/usr/share/zabbix';

    location = /ping {
        access_log off;

        fastcgi_pass                    unix:/tmp/php-fpm.sock;

        fastcgi_param  SCRIPT_FILENAME  $webroot$fastcgi_script_name;
        include fastcgi_params;
    }

    location = /status {
        access_log off;

        if ($status_query_denied) {
            return 403;
        }

        fastcgi_pass                    unix:/tmp/php-fpm-status.sock;

        fastcgi_param  SCRIPT_FILENAME  $webroot$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        return 404;
    }
}

sonar.projectKey=zabbix-docker
sonar.organization=zabbix

sonar.python.version=3.12,3.14
sonar.plsql.file.suffixes=.pls,.plsql,.pks,.pkb
sonar.tests=templates/entrypoints
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/build-wrapper-dump.json,Dockerfiles/*/windows/Dockerfile*
sonar.go.coverage.reportPaths=templates/entrypoints/coverage.out
sonar.coverage.exclusions=examples/**
sonar.cpd.exclusions=Dockerfiles/*/rhel/README.html

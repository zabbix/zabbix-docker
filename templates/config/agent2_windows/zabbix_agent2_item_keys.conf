### Option: AllowKey
#	Allow execution of item keys matching pattern.
#	Multiple keys matching rules may be defined in combination with DenyKey, AllowKeyRegexp and DenyKeyRegexp.
#	Key pattern is wildcard expression, which support "*" character to match any number of any characters in certain position. It might be used in both key name and key arguments.
#	Parameters are processed one by one according their appearance order.
#	If no AllowKey, DenyKey, AllowKeyRegexp and DenyKeyRegexp rules defined, all keys are allowed.
#
# Mandatory: no

### Option: DenyKey
#	Deny execution of item keys matching pattern.
#	Multiple keys matching rules may be defined in combination with AllowKey, AllowKeyRegexp and DenyKeyRegexp.
#	Key pattern is wildcard expression, which support "*" character to match any number of any characters in certain position. It might be used in both key name and key arguments.
#	Parameters are processed one by one according their appearance order.
#	If no AllowKey, DenyKey, AllowKeyRegexp and DenyKeyRegexp rules defined, all keys are allowed.
#	Unless another system.run[*] rule is specified DenyKey=system.run[*] is added by default.
#
# Mandatory: no
# Default:
# DenyKey=system.run[*]

### Option: AllowKeyRegexp
#	Allow execution of item keys matching a regular expression pattern.
#	Multiple keys matching rules may be defined in combination with DenyKeyRegexp, AllowKey and DenyKey.
#	All AllowKey, DenyKey, AllowKeyRegexp and DenyKeyRegexp rules are merged into a single ordered list
#	and processed one by one according to their appearance order in the configuration file.
#	The first matching rule determines the result (allow or deny).
#	Key pattern is a regular expression (PCRE2) that must match the full item key string
#	(key name and parameter string) as received by the agent. Full-string matching is enforced
#	automatically; the pattern cannot match a substring of the key.
#	Only the common subset of regex syntax supported by both PCRE2 and RE2 should be used
#	to ensure the same pattern works on both Zabbix agent and Zabbix agent 2.
#	Example: AllowKeyRegexp=system\.run\[(?:/usr)?/bin/hostname(?: -[fsd])?\]
#
# Mandatory: no

### Option: DenyKeyRegexp
#	Deny execution of item keys matching a regular expression pattern.
#	Multiple keys matching rules may be defined in combination with AllowKeyRegexp, AllowKey and DenyKey.
#	All AllowKey, DenyKey, AllowKeyRegexp and DenyKeyRegexp rules are merged into a single ordered list
#	and processed one by one according to their appearance order in the configuration file.
#	The first matching rule determines the result (allow or deny).
#	Key pattern is a regular expression (PCRE2) that must match the full item key string
#	(key name and parameter string) as received by the agent. Full-string matching is enforced
#	automatically; the pattern cannot match a substring of the key.
#	Only the common subset of regex syntax supported by both PCRE2 and RE2 should be used
#	to ensure the same pattern works on both Zabbix agent and Zabbix agent 2.
#	Unless another system.run[*] rule is specified DenyKey=system.run[*] is added by default.
#	Example: DenyKeyRegexp=system\.run\[.*(?:rm -rf|poweroff|reboot).*\]
#
# Mandatory: no

### Option: EnableProfiler
#	Whether periodic Go profiling is enabled on agent startup.
#	Profiling can also be enabled or disabled at runtime using the -R option.
#	While periodic_prof_execute is collecting profiles, all profiler runtime commands are rejected as busy.
#
# Mandatory: no
# Range: 0-1
# Default:
# EnableProfiler=0

EnableProfiler=${ZBX_ENABLEPROFILER}

### Option: ProfilerDir
#	Directory where profiling data will be written.
#
# Mandatory: no
# Default:
# ProfilerDir=/tmp/zabbix_agent2_profiles

ProfilerDir=${ZBX_PROFILERDIR}

### Option: ProfilerMaxFilesPerProfile
#	Maximum number of files to keep for each profile type.
#	The limit is applied to completed files after each profile dump.
#	The active CPU profile is collected in a hidden temporary file and does not count toward the limit.
#	Files created by periodic_prof_execute are also subject to the limit.
#
# Mandatory: no
# Range: 1-100
# Default:
# ProfilerMaxFilesPerProfile=10

ProfilerMaxFilesPerProfile=${ZBX_PROFILERMAXFILESPERPROFILE}

### Option: ProfilerInterval
#	Profiling data write interval, in seconds.
#
# Mandatory: no
# Range: 1-86400
# Default:
# ProfilerInterval=3600

ProfilerInterval=${ZBX_PROFILERINTERVAL}

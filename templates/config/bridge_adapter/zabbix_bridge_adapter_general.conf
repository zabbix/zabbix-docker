############ GENERAL PARAMETERS ############

### Option: ServerId
#	Unique identifier of Zabbix server.
#	Available in Reports > System information in the Zabbix web interface.
#
# Mandatory: yes
# Default:
# ServerId=

ServerId=${ZBX_SERVERID}

### Option: ZabbixBridgeURL
#	Zabbix Bridge URL for Zabbix Bridge configuration retrieval.
#	Retrieved on Zabbix Bridge Adapter startup.
#
# Mandatory: no
# Default:
# ZabbixBridgeURL=https://config.mobilebridge.zabbix.com/.well-known/bridge-configuration

ZabbixBridgeURL=${ZBX_ZABBIXBRIDGEURL}

############ ZABBIX API CLIENT PARAMETERS ############

### Option: ZabbixAPIURL
#	URL of Zabbix API endpoint.
#	Example:
#	    ZabbixAPIURL=https://example.com/zabbix/api_jsonrpc.php
#
# Mandatory: yes
# Default:
# ZabbixAPIURL=

ZabbixAPIURL=${ZBX_ZABBIXAPIURL}

### Option: ZabbixAPITLSConnect
#	TLS mode for outbound connections to the Zabbix API:
#		disabled    - use plain HTTP; ZabbixAPIURL must use http://
#		required    - use HTTPS without certificate verification (testing only)
#		verify_ca   - use HTTPS and verify the server certificate
#		verify_full - use HTTPS and verify the server certificate and hostname
#
#	An empty or unset value is treated as required.
#
# Mandatory: no
# Default:
# ZabbixAPITLSConnect=required

ZabbixAPITLSConnect=${ZBX_ZABBIXAPITLSCONNECT}

### Option: ZabbixAPITLSCAFile
#	Full pathname of a file containing the top-level CA certificate(s) used by
#	the Adapter to verify the Zabbix API server certificate.
#
# Mandatory: yes, if ZabbixAPITLSConnect is verify_ca or verify_full
# Default:
# ZabbixAPITLSCAFile=

ZabbixAPITLSCAFile=${ZBX_ZABBIXAPITLSCAFILE}

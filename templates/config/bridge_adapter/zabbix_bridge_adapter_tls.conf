############ ADAPTER LISTENER TLS PARAMETERS ############

### Option: TLSConfig.Mode
#	TLS mode for incoming connections on ListenPort:
#		none - accept connections without encryption
#		tls  - standard TLS with v1.2 minimum
#		mtls - TLS with mutual authentication
#
# Mandatory: no
# Default:
# TLSConfig.Mode=none

TLSConfig.Mode=${ZBX_TLSMODE}

### Option: TLSConfig.CertFile
#	Full path to a file containing the certificate or certificate chain.
#
# Mandatory: no
# Default:
# TLSConfig.CertFile=

TLSConfig.CertFile=${ZBX_TLSCERTFILE}

### Option: TLSConfig.KeyFile
#	Full path to a file containing the private key.
#
# Mandatory: no
# Default:
# TLSConfig.KeyFile=

TLSConfig.KeyFile=${ZBX_TLSKEYFILE}

### Option: TLSConfig.CAFile
#	Full path to a file containing the top-level CA certificate(s) used
#	to verify client certificates in mTLS mode.
#
# Mandatory: no
# Default:
# TLSConfig.CAFile=

TLSConfig.CAFile=${ZBX_TLSCAFILE}

### Option: TLSConfig.AllowedCN
#	Comma-separated list of permitted client Common Names (mTLS only).
#	If not set, the Adapter does not check the client Common Name.
#
# Mandatory: no
# Default:
# TLSConfig.AllowedCN=

TLSConfig.AllowedCN=${ZBX_TLSALLOWEDCN}

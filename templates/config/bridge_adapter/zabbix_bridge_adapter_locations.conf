############ LOCATION PARAMETERS ############

### Option: DataDir
#	Directory where Zabbix Bridge Adapter state files and encryption keys are stored.
#	The directory must already exist and be writable by the Adapter user.
#
# Mandatory: no
# Default:
# DataDir=/var/lib/zabbix/bridge-adapter

DataDir=/var/lib/zabbix/bridge-adapter

### Option: PidFile
#	Name of PID file.
#
# Mandatory: no
# Default:
# PidFile=/tmp/zabbix_bridge_adapter.pid

PidFile=/tmp/zabbix_bridge_adapter.pid

############ ADVANCED PARAMETERS ############

### Option: DataDir
#   A directory where the Zabbix Bridge Adapter state file and encryption keys are created and stored.
#   The directory specified must exist with minimal permissions 0700 on the host machine running
#   Zabbix Bridge Adapter.
#
# Mandatory: no
# Default:
# DataDir=/var/lib/zabbix-bridge-adapter

DataDir=/var/lib/zabbix/bridge-adapter

### Option: PidFile
#	Name of PID file.
#
# Mandatory: no
# Default:
# PidFile=/tmp/zabbix_bridge_adapter.pid

PidFile=/tmp/zabbix_bridge_adapter.pid

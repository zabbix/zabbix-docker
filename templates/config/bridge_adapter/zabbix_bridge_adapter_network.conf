############ NETWORK PARAMETERS ############

### Option: ListenIP
#	IP address or hostname to listen on for incoming connections from Zabbix server.
#	If not set, all available IP addresses of the local system will be listened on.
#
# Mandatory: no
# Default:
# ListenIP=

ListenIP=${ZBX_LISTENIP}

### Option: ListenPort
#	Port to listen on for incoming HTTP/HTTPS connections from Zabbix server.
#
# Mandatory: no
# Range: 1024-32767
# Default:
# ListenPort=10054

ListenPort=${ZBX_LISTENPORT}

### Option: ListenHealthPort
#	Port to listen on for incoming HTTP health-check connections.
#	Serves the /health and /ready endpoints.
#	If not set, the health service is not started.
#
# Mandatory: no
# Range: 1024-32767
# Default:
# ListenHealthPort=8081

ListenHealthPort=${ZBX_LISTENHEALTHPORT}

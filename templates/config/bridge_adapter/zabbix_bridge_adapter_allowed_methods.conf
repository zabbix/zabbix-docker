# This file is copied to /tmp and populated by the container entrypoint
# only when ZBX_ALLOWEDAPIMETHODS_<N> variables are specified for the service.

############ SECURITY PARAMETERS ############

### Option: AllowedAPIMethods
#   Zabbix API methods the Adapter is allowed to forward. Repeat the key to
#   list several. Each entry is either an exact method name, or one of the
#   two supported wildcard forms: 'resource.*' or '*.method'. No other
#   wildcard placement, and no standalone '*', is permitted. Every entry
#   must follow 'resource.method' - exactly one '.', non-empty on both
#   sides.
#   Leaving this option out means deny all. A blank value is not the same
#   and is rejected at startup.
#   Example:
#       AllowedAPIMethods=apiinfo.version
#       AllowedAPIMethods=problem.*
#       AllowedAPIMethods=*.get
#
#   Minimal set of methods the mobile application currently needs:
#       AllowedAPIMethods=apiinfo.version
#       AllowedAPIMethods=device.onboard
#       AllowedAPIMethods=device.offboard
#       AllowedAPIMethods=user.get
#       AllowedAPIMethods=role.get
#       AllowedAPIMethods=problem.get
#       AllowedAPIMethods=event.get
#       AllowedAPIMethods=event.acknowledge
#       AllowedAPIMethods=trigger.get
#       AllowedAPIMethods=alert.get
#       AllowedAPIMethods=host.get
#       AllowedAPIMethods=hostgroup.get
#
# Mandatory: no
# Default: (empty - deny all)

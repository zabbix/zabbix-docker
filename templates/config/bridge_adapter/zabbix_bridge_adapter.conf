# This is a configuration file for Zabbix Bridge Adapter
# To get more information about Zabbix, visit https://www.zabbix.com

### Option: Include
#	You may include individual files or all files in a directory in the configuration file.
#
# Mandatory: no
# Default:
# Include=

Include=/etc/zabbix/zabbix_bridge_adapter_general.conf
Include=/etc/zabbix/zabbix_bridge_adapter_api.conf
Include=/etc/zabbix/zabbix_bridge_adapter_locations.conf
Include=/etc/zabbix/zabbix_bridge_adapter_logging.conf
Include=/etc/zabbix/zabbix_bridge_adapter_network.conf
Include=/etc/zabbix/zabbix_bridge_adapter_tls.conf
# The wildcard keeps this include optional. The container entrypoint creates
# the runtime file only when ZBX_ALLOWEDAPIMETHODS_<N> variables are specified.
Include=/tmp/zabbix_bridge_adapter_allowed_methods*.conf

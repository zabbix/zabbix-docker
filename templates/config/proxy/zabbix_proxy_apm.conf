### Option: APMListenIP
#	IP address that the APM collector should listen on.
#
# Mandatory: no
# Default:
# APMListenIP=0.0.0.0

APMListenIP=${ZBX_APMLISTENIP}

### Option: APMListenPort
#	Port that the APM collector should listen on.
#
# Mandatory: no
# Range: 1024-32767
# Default:
# APMListenPort=4317

APMListenPort=${ZBX_APMLISTENPORT}

### Option: APMTLSCAFile
#	Full pathname of the file containing the top-level CA certificates
#	for verifying applications or OpenTelemetry collectors.
#
# Mandatory: no
# Default:
# APMTLSCAFile=

APMTLSCAFile=${ZBX_APMTLSCAFILE}

### Option: APMTLSCertFile
#	Full pathname of the file containing the APM collector certificate
#	or certificate chain.
#
# Mandatory: no
# Default:
# APMTLSCertFile=

APMTLSCertFile=${ZBX_APMTLSCERTFILE}

### Option: APMTLSKeyFile
#	Full pathname of the file containing the APM collector private key.
#
# Mandatory: no
# Default:
# APMTLSKeyFile=

APMTLSKeyFile=${ZBX_APMTLSKEYFILE}

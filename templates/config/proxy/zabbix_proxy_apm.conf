### Option: APMListenIP
#	IP address that the APM collector should listen on.
#	APM collector will listen on all network interfaces if this parameter is missing.
#
# Mandatory: no
# Default:
# APMListenIP=0.0.0.0

APMListenIP=${ZBX_APMLISTENIP}

### Option: APMListenPort
#	Listen port for APM collector.
#
# Mandatory: no
# Range: 1024-32767
# Default:
# APMListenPort=4317

APMListenPort=${ZBX_APMLISTENPORT}

### Option: APMTLSCAFile
#	Full pathname of a file containing the top-level CA(s) certificates for
#	peer certificate verification by APM collector.
#
# Mandatory: no
# Default:
# APMTLSCAFile=

APMTLSCAFile=${ZBX_APMTLSCAFILE}

### Option: APMTLSCertFile
#	Full pathname of a file containing the APM collector certificate or certificate chain.
#
# Mandatory: no
# Default:
# APMTLSCertFile=

APMTLSCertFile=${ZBX_APMTLSCERTFILE}

### Option: APMTLSKeyFile
#	Full pathname of a file containing the APM collector private key.
#
# Mandatory: no
# Default:
# APMTLSKeyFile=

APMTLSKeyFile=${ZBX_APMTLSKEYFILE}

# This is a configuration file for Zabbix MCP server (Unix)
# To get more information about Zabbix, visit https://www.zabbix.com

############ GENERAL PARAMETERS #################

### Option: LogType
#	Specifies where log messages are written to:
#		system  - syslog
#		file    - file specified with LogFile parameter
#		console - standard output
#
# Mandatory: no
# Default:
# LogType=file

LogType=console

### Option: LogFile
#	Log file name for LogType 'file' parameter.
#
# Mandatory: no
# Default:
# LogFile=/tmp/zabbix_mcp_server.log

### Option: LogFileSize
#	Maximum size of log file in MB.
#	0 - disable automatic log rotation.
#
# Mandatory: no
# Range: 0-1024
# Default:
# LogFileSize=1

### Option: DebugLevel
#	Specifies debug level:
#	0 - basic information about starting and stopping of Zabbix processes
#	1 - critical information
#	2 - error information
#	3 - warnings
#	4 - for debugging (produces lots of information)
#	5 - extended debugging (produces even more information)
#
# Mandatory: no
# Range: 0-5
# Default:
# DebugLevel=3

DebugLevel=${ZBX_DEBUGLEVEL}

############ ZABBIX API CLIENT PARAMETERS #################

### Option: FrontendURL
#	Zabbix API endpoint URL: the Zabbix frontend URL ending with
#	'api_jsonrpc.php'. Every tool and resource call is forwarded to this
#	address, authenticated with the Zabbix API token supplied by the MCP
#	client.
#	Example: FrontendURL=https://instance.example.com/api_jsonrpc.php
#
# Mandatory: yes
# Default:
# FrontendURL=

FrontendURL=${ZBX_FRONTEND_URL}

### Option: Timeout
#	Zabbix API client full request timeout in seconds.
#
# Mandatory: no
# Range: 3-30
# Default:
# Timeout=10

Timeout=${ZBX_TIMEOUT}

### Option: IgnoreURLCertErrors
#	Disables TLS certificate validation for Zabbix API client calls.
#	Should be used only in a development environment.
#
# Mandatory: no
# Default:
# IgnoreURLCertErrors=false

IgnoreURLCertErrors=${ZBX_IGNOREURLCERTERRORS}

############ ZABBIX MCP SERVER PARAMETERS #################

### Option: ListenIP
#	IP address that the MCP server should listen on for connections from
#	MCP clients.
#
# Mandatory: no
# Default:
# ListenIP=0.0.0.0

ListenIP=${ZBX_LISTENIP}

### Option: ListenPort
#	MCP server will listen on this port for connections from MCP clients.
#	The MCP endpoint is served on the /mcp path, for example
#	https://mcp.example.com:8443/mcp
#
# Mandatory: no
# Range: 1024-32767
# Default:
# ListenPort=8443

ListenPort=${ZBX_LISTENPORT}

### Option: AllowedIP
#	Incoming connections will be accepted only from the hosts listed here.
#	Comma-delimited list of IP addresses, CIDR networks or DNS names.
#
# Mandatory: yes
# Default:
# AllowedIP=

AllowedIP=${ZBX_ALLOWEDIP}

### Option: MaxResponseSize
#	Maximum size of a single tool response, in bytes; a K suffix denotes
#	kilobytes.
#	Every tool that returns a list of Zabbix objects is bounded twice: by the
#	number of results, which is defined per call (limit, default 100,
#	maximum 1000), and by the size of the serialized response, which this
#	parameter defines. Whichever limit is reached first stops the response.
#	The two limits are not interchangeable. A result count does not bound the
#	response size, because the size of a single result varies by several
#	orders of magnitude across tools: a numeric history value is under a
#	hundred bytes, while a single log line or a host returned with its full
#	trigger set can be tens of kilobytes.
#	Results are accumulated until the next one would exceed the limit.
#	The limit applies to the text of the tool result, which is what the
#	agent receives. The MCP message that carries it over HTTP is larger: the
#	text travels as a JSON string, so its quotes and backslashes are escaped,
#	and the MCP SDK also writes each <, > and & as a six-character escape.
#	The client removes this encoding before the agent sees the result.
#	Truncation always happens between results, never inside one: a response
#	never contains a partial object.
#	A truncated response reports which limit was reached, so that the caller
#	can narrow its query accordingly. There is no way to request the results
#	that were left out: the caller must issue a narrower query instead, using
#	a smaller time range, fewer hosts, or a more specific filter.
#	The value should be chosen to fit the context window of the AI agents that
#	connect to this server. A response consumes roughly one token per three
#	bytes, so 64K is in the order of twenty thousand tokens. Raising this
#	value lets an agent retrieve more in a single call, at the cost of leaving
#	it less room for the rest of its conversation.
#
# Mandatory: no
# Range: 16K-256K
# Default:
# MaxResponseSize=64K

MaxResponseSize=${ZBX_MAX_RESPONSE_SIZE}

### Option: ToolPrefix
#	Prefix prepended verbatim to the name of every exposed tool.
#	For example, with ToolPrefix=zabbix_ the tool host_get is exposed as
#	zabbix_host_get. Without a prefix tools keep their plain names.
#	AllowTool, DenyTool, AllowToolRegexp and DenyToolRegexp match the plain
#	tool names and ignore the prefix.
#	Allowed characters: letters, digits, underscore, hyphen and dot.
#
# Mandatory: no
# Default:
# ToolPrefix=

ToolPrefix=${ZBX_TOOL_PREFIX}

####### TLS-RELATED PARAMETERS #######

### Option: TLSAccept
#	What incoming connections to accept.
#	Only one value can be specified:
#		unencrypted - accept connections without encryption
#		cert        - accept connections secured with TLS and a certificate
#	Accepting unencrypted connections is only appropriate when TLS is
#	terminated by a trusted reverse proxy in front of the MCP server: the
#	Zabbix API token travels in the Authorization header of every request.
#
# Mandatory: no
# Default:
# TLSAccept=unencrypted

TLSAccept=${ZBX_TLSACCEPT}

### Option: TLSCertFile
#	Full pathname of a file containing the MCP server certificate or
#	certificate chain.
#
# Mandatory: yes, if TLSAccept is set to cert, otherwise no
# Default:
# TLSCertFile=

TLSCertFile=${ZBX_TLSCERTFILE}

### Option: TLSKeyFile
#	Full pathname of a file containing the MCP server private key.
#
# Mandatory: yes, if TLSAccept is set to cert, otherwise no
# Default:
# TLSKeyFile=

TLSKeyFile=${ZBX_TLSKEYFILE}

Include=/tmp/zabbix_mcp_server_tool_access.conf

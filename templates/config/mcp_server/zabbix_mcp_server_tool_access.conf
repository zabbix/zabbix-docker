####### TOOL ACCESS PARAMETERS #######

### Option: AllowTool
#	Allow exposing of tools matching pattern.
#	Multiple tool matching rules may be defined in combination with DenyTool,
#	AllowToolRegexp and DenyToolRegexp.
#	Tool pattern is a wildcard expression, which supports the "*" character
#	to match any number of any characters in a certain position.
#	All AllowTool, DenyTool, AllowToolRegexp and DenyToolRegexp rules are
#	merged into a single list and processed one by one according to their
#	appearance order in the configuration file. The first matching rule
#	determines the result. A tool that matches no rule is allowed, so
#	trailing AllowTool rules are redundant and AllowTool rules without a
#	DenyTool rule are a configuration error; end an allow list with
#	DenyTool=*.
#	A denied tool is not registered at all: it is absent from the tools/list
#	response and cannot be invoked. The same rules apply to resource reads,
#	so a denied tool's data cannot be reached through the zabbix:// scheme.
#	These rules restrict what this server exposes. They do not affect the
#	permissions of the Zabbix API token holder, which Zabbix alone enforces.
#	Rules match the plain tool names and ignore ToolPrefix.
#
# Mandatory: no
# Default:
# AllowTool=

### Option: DenyTool
#	Deny exposing of tools matching pattern.
#	Multiple tool matching rules may be defined in combination with AllowTool,
#	AllowToolRegexp and DenyToolRegexp.
#	Tool pattern is a wildcard expression, which supports the "*" character
#	to match any number of any characters in a certain position.
#	Rules are processed one by one according to their appearance order; see
#	AllowTool.
#	The tools below return item keys, macro values, interface addresses and
#	raw item values, which more often carry secrets than other objects. They
#	are denied here; remove a rule to expose the tool when an agent has a
#	concrete need for it. Without item_get the history_get tool cannot obtain
#	item IDs, so it is denied as well.
#	Rules match the plain tool names and ignore ToolPrefix.
#
# Mandatory: no
# Default:
# DenyTool=

DenyTool=item_get
DenyTool=lld_get
DenyTool=interface_get
DenyTool=macro_get
DenyTool=history_get

### Option: AllowToolRegexp
#	Allow exposing of tools matching a regular expression pattern.
#	Multiple tool matching rules may be defined in combination with
#	DenyToolRegexp, AllowTool and DenyTool.
#	All AllowTool, DenyTool, AllowToolRegexp and DenyToolRegexp rules are
#	merged into a single list and processed one by one according to their
#	appearance order in the configuration file. The first matching rule
#	determines the result.
#	Tool pattern is a regular expression (RE2) matched against the plain tool
#	name; anchor it with ^ and $ to match the whole name.
#	Rules match the plain tool names and ignore ToolPrefix.
#	Example: AllowToolRegexp=^(problem|host)_
#
# Mandatory: no
# Default:
# AllowToolRegexp=

### Option: DenyToolRegexp
#	Deny exposing of tools matching a regular expression pattern.
#	Multiple tool matching rules may be defined in combination with
#	AllowToolRegexp, AllowTool and DenyTool.
#	All AllowTool, DenyTool, AllowToolRegexp and DenyToolRegexp rules are
#	merged into a single list and processed one by one according to their
#	appearance order in the configuration file. The first matching rule
#	determines the result.
#	Tool pattern is a regular expression (RE2) matched against the plain tool
#	name; anchor it with ^ and $ to match the whole name.
#	Rules match the plain tool names and ignore ToolPrefix.
#	Example: DenyToolRegexp=^maintenance_(create|delete)$
#
# Mandatory: no
# Default:
# DenyToolRegexp=
